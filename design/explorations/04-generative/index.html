<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Generative visuals (exploration)</title>
  <style>
    @font-face { font-family: 'DM Sans'; src: url('../03-pixel-tiles/fonts/dm-sans.woff2') format('woff2'); font-weight: 100 1000; }
    @font-face { font-family: 'NM'; src: url('../03-pixel-tiles/fonts/noto-music-accidentals.woff2') format('woff2'); unicode-range: U+266D-266F; }
    :root {
      --bg: #0b0b0b; --text: #f4f0e8; --muted: #a8a39a; --ink: #121110; --go: #33a066;
      --glass: rgb(20 20 20 / 0.72); --line: rgb(255 255 255 / 0.08);
      --font: 'DM Sans', 'NM', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
    button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    /* Top bar */
    .top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: max(8px, env(safe-area-inset-top)) 12px 0; z-index: 2; }
    .tabs { display: flex; }
    .tab { height: 48px; padding: 0 12px; font-weight: 500; font-size: 17px; color: var(--muted); }
    .tab.on { color: var(--text); }
    .seg { display: flex; padding: 3px; border-radius: 999px; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .seg button { height: 42px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); }
    .seg button[aria-pressed='true'] { background: var(--text); color: var(--ink); }

    /* Centre: the chord, with a guaranteed dark pool behind it for contrast */
    .stage { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 1; padding-bottom: 180px; }
    .pool { position: absolute; width: min(92vw, 760px); aspect-ratio: 2 / 1; background: radial-gradient(closest-side, rgb(11 11 11 / 0.92), rgb(11 11 11 / 0.7) 55%, transparent); }
    .chord { position: relative; font-weight: 500; font-size: clamp(96px, 26vw, 210px); line-height: 1; letter-spacing: -0.03em; white-space: nowrap; text-shadow: 0 0 40px rgb(0 0 0 / 0.6); }
    .chord .acc { font-size: 0.62em; vertical-align: 0.42em; margin-left: 0.01em; }
    .chord .m { font-size: 0.62em; margin-left: 0.01em; }
    .chord .q { font-size: 0.42em; vertical-align: 1.05em; margin-left: 0.04em; letter-spacing: -0.01em; }
    .sub { position: relative; margin-top: 14px; text-align: center; color: var(--muted); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }

    /* Floating panel */
    .panel { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 2; margin: 0 auto; max-width: 720px;
      padding: 10px; border-radius: 28px; background: var(--glass); backdrop-filter: blur(28px) saturate(1.2); -webkit-backdrop-filter: blur(28px) saturate(1.2); border: 1px solid var(--line); }
    .loop { position: relative; height: 3px; margin: 2px 10px 10px; border-radius: 2px; background: rgb(255 255 255 / 0.12); overflow: hidden; }
    .loop i { position: absolute; inset: 0 auto 0 0; background: var(--text); width: 0; }
    .prog { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
    .prog::-webkit-scrollbar { display: none; }
    .pill { flex: 1 0 auto; min-width: 64px; height: 48px; padding: 0 14px; border-radius: 999px; background: rgb(255 255 255 / 0.06); font-size: 17px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .pill .dot { width: 8px; height: 8px; border-radius: 99px; }
    .pill .nm { white-space: nowrap; }
    .pill sup { font-size: 11px; vertical-align: 6px; margin-left: 1px; }
    .pill[aria-current='true'] { background: var(--text); color: var(--ink); }
    .row { display: flex; gap: 6px; align-items: center; }
    .chip { height: 48px; padding: 0 14px; border-radius: 999px; background: rgb(255 255 255 / 0.06); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
    .chip .k { color: var(--muted); }
    .chip .held { font-size: 11px; letter-spacing: .06em; padding: 2px 6px; border-radius: 6px; background: var(--text); color: var(--ink); }
    .chip.grow { flex: 1; justify-content: space-between; }
    .actions { margin-top: 2px; }
    .settings { margin-top: 8px; }
    .back { width: 56px; height: 56px; border-radius: 999px; background: rgb(255 255 255 / 0.06); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
    .reroll { flex: 1; height: 56px; border-radius: 999px; background: var(--text); color: var(--ink); font-size: 16px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .play { width: 56px; height: 56px; border-radius: 999px; background: var(--go); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
    svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

    @media (min-width: 900px) {
      .stage { padding-bottom: 120px; }
      .panel { max-width: 980px; padding: 12px; }
      .panel-grid { display: grid; grid-template-columns: 1fr auto; grid-template-areas: 'p a' 's s'; gap: 10px 12px; align-items: center; }
      .prog { grid-area: p; padding-bottom: 0; }
      .actions { grid-area: a; margin-top: 0; }
      .actions .reroll { width: 200px; flex: none; }
      .settings { grid-area: s; margin-top: 0; }
      .settings .chip.grow { flex: none; min-width: 180px; }
    }
  </style>
</head>
<body>
  <canvas id="viz" aria-hidden="true"></canvas>
  <header class="top">
    <nav class="tabs"><button class="tab on">Jam</button><button class="tab">Solo</button></nav>
    <div class="seg" role="group" aria-label="Rendering (exploration only)">
      <button id="lines" aria-pressed="true">Lines</button><button id="dots" aria-pressed="false">Dots</button>
    </div>
  </header>
  <div class="stage" aria-live="off">
    <div class="pool"></div>
    <div>
      <div class="chord" id="chord" role="img"></div>
      <div class="sub" id="sub"></div>
    </div>
  </div>
  <div class="panel">
    <div class="loop" role="progressbar" aria-label="Position in the loop"><i id="loop"></i></div>
    <div class="panel-grid">
      <div class="prog" id="prog"></div>
      <div class="row actions">
        <button class="back" id="back" aria-label="Previous progression"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button class="reroll" id="reroll"><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>Re-roll</button>
        <button class="play" id="play" aria-label="Play"></button>
      </div>
      <div class="row settings" id="settings"></div>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
