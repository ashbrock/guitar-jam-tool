<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Chord wheel (exploration)</title>
  <link rel="stylesheet" href="../../../src/ui/styles/tokens.css" />
  <link rel="stylesheet" href="../../../src/ui/styles/base.css" />
  <style>
    body { overflow-y: auto; }
    .page { max-width: 560px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) var(--s-12) var(--s-24); }
    h1 { margin: var(--s-8) 4px 2px; font-size: var(--t-body); font-weight: 500; }
    .sub { margin: 0 4px var(--s-12); font-size: var(--t-caption); color: var(--muted); }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); margin-bottom: var(--gap); }
    .seg button, .row button, .row select { height: var(--target-min); border-radius: var(--r-pill); font-size: var(--t-small); font-weight: 500; }
    .row { display: flex; gap: var(--gap); }
    .row select { flex: 1; min-width: 0; padding: 0 var(--s-12); background: var(--fill-2); color: var(--text); border: 0; font: inherit; font-size: var(--t-small); appearance: none; }
    .row button { padding: 0 var(--s-16); }
    .wheel-wrap { display: flex; justify-content: center; margin: var(--s-16) 0 var(--s-8); }
    svg.wheel { width: min(100%, 440px); height: auto; display: block; touch-action: manipulation; }
    .wheel text { font-family: var(--font); fill: var(--text); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .wheel .cell { fill: var(--track-card); stroke: var(--bg); stroke-width: 3; cursor: pointer; transition: fill var(--dur-switch) ease; }
    .wheel .cell.ext { fill: var(--fill-1); }
    @media (hover: hover) { .wheel .cell:hover { fill: var(--fill-open); } }
    .wheel .cell.off { fill: var(--fill-1); cursor: default; }
    .wheel .outline { fill: none; stroke: var(--text); stroke-width: 2; pointer-events: none; }
    .wheel .t-off { fill: var(--muted); opacity: 0.45; }
    .wheel .t-ext { fill: var(--muted); }
    /* In the progression: a ring (shape, not colour). */
    /* Playing or picked: solid white, ink text. */
    .wheel .cell.now { fill: var(--text); }
    .wheel .t-now { fill: var(--ink); }
    .wheel .path { fill: none; stroke: var(--text); stroke-width: 1.5; opacity: 0.55; pointer-events: none; }
    .wheel .path.chorus { stroke-dasharray: 5 5; }
    .wheel .dot { fill: var(--text); opacity: 0.7; pointer-events: none; }
    .wheel .centre { font-size: 15px; font-weight: 500; }
    .wheel .centre-sub { font-size: 11px; fill: var(--muted); }
    .legend { display: flex; flex-wrap: wrap; gap: var(--s-8) var(--s-16); justify-content: center; margin: 0 0 var(--s-12); font-size: var(--t-fine); color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { display: inline-block; width: 18px; height: 0; border-top: 1.5px solid var(--text); opacity: 0.7; }
    .legend i.d { border-top-style: dashed; }
    .legend b { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 2px solid var(--text); }
    .chips { display: flex; flex-wrap: wrap; gap: var(--gap); margin: 0 0 var(--s-12); }
    .chips .label { width: 100%; font-size: var(--t-small); color: var(--muted); margin: 0 4px; }
    .chip { min-height: 40px; padding: 0 var(--s-14); border-radius: var(--r-pill); background: var(--fill-2); font-size: var(--t-small); font-weight: 500; }
    .chip.now { background: var(--text); color: var(--ink); }
    .note { margin: var(--s-16) 4px 0; font-size: var(--t-caption); color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Chord wheel</h1>
    <p class="sub">Sketch. Not wired into the app. Tap any chord or extension to hear it.</p>
    <div class="seg" role="radiogroup" aria-label="Layout">
      <button class="fill-1" role="radio" data-v="a">A · Key wheel</button>
      <button class="fill-1" role="radio" data-v="b">B · Circle of fifths</button>
    </div>
    <div class="row">
      <select id="key" aria-label="Key"></select>
      <select id="vibe" aria-label="Vibe"></select>
    </div>
    <div class="row" style="margin-top: var(--gap)">
      <button class="inv" id="reroll" style="flex: 1">Re-roll</button>
      <button class="fill" id="play" style="flex: 1">Play</button>
    </div>
    <div class="wheel-wrap"><svg class="wheel" id="wheel" viewBox="0 0 400 400" role="group" aria-label="Chord wheel"></svg></div>
    <div class="legend" aria-hidden="true">
      <span><b></b>in the progression</span><span><i></i>verse path</span><span><i class="d"></i>chorus path</span>
    </div>
    <div class="chips" id="exts"></div>
    <div class="chips" id="outside"></div>
    <div class="chips" id="verse"></div>
    <div class="chips" id="chorus"></div>
    <p class="note" id="note"></p>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
